# Unit tests for the alert rules. Run with: make check-monitoring
#
# Each test feeds made-up metric values over time and checks which alerts fire.

rule_files:
  - ../../deploy/helm/sftpgate/files/alerts.yml

evaluation_interval: 1m

tests:
  - name: down after one minute without a scrape
    interval: 1m
    input_series:
      - series: 'up{job="sftpgate", instance="sftpgate:8080"}'
        values: "1 0 0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: SftpgateDown
        exp_alerts: []
      - eval_time: 3m
        alertname: SftpgateDown
        exp_alerts:
          - exp_labels: { severity: critical, job: sftpgate, instance: "sftpgate:8080" }
            exp_annotations:
              summary: SFTPgate is not answering on /metrics.

  - name: login failure spike, but not for a few failures
    interval: 1m
    input_series:
      # 10 failures a minute: 50 in 5 minutes.
      - series: 'sftpgate_auth_total{account="_unknown", method="any", result="failed"}'
        values: "0+10x10"
      # 1 failure a minute stays quiet.
      - series: 'sftpgate_auth_total{account="_unknown", method="any", result="ok"}'
        values: "0+1x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: SftpgateLoginFailureSpike
        exp_alerts: []
      - eval_time: 6m
        alertname: SftpgateLoginFailureSpike
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: More than 20 failed logins in 5 minutes. Someone may be guessing passwords.

  - name: storage errors name the failing storage
    interval: 1m
    input_series:
      - series: 'sftpgate_storage_errors_total{storage="recon-raw"}'
        values: "0 0 3 3"
      - series: 'sftpgate_storage_errors_total{storage="reports"}'
        values: "0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: SftpgateStorageErrors
        exp_alerts:
          - exp_labels: { severity: critical, storage: recon-raw }
            exp_annotations:
              summary: Storage recon-raw is returning errors. Uploads or downloads may be failing.

  - name: rejected config reload
    interval: 1m
    input_series:
      - series: 'sftpgate_config_reload_total{result="error"}'
        values: "0 0 1 1"
    alert_rule_test:
      - eval_time: 3m
        alertname: SftpgateConfigReloadFailed
        exp_alerts:
          - exp_labels: { severity: warning, result: error }
            exp_annotations:
              summary: A new config was rejected. The old config is still running; check the logs and fix the file.

  - name: spool disk low only after five minutes
    interval: 1m
    input_series:
      # 1 GiB free, all the time.
      - series: "sftpgate_spool_free_bytes"
        values: "1073741824x10"
    alert_rule_test:
      - eval_time: 2m
        alertname: SftpgateSpoolDiskLow
        exp_alerts: []
      - eval_time: 6m
        alertname: SftpgateSpoolDiskLow
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Less than 2 GiB free on the upload spool disk. Large uploads will soon be refused.

  - name: healthy server raises nothing
    interval: 1m
    input_series:
      - series: 'up{job="sftpgate", instance="sftpgate:8080"}'
        values: "1x10"
      - series: 'sftpgate_config_info{hash="abc", revision=""}'
        values: "1x10"
      - series: "sftpgate_spool_free_bytes"
        values: "107374182400x10"
      - series: "sftpgate_throttled_ips"
        values: "0x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: SftpgateDown
        exp_alerts: []
      - eval_time: 10m
        alertname: SftpgateNotReady
        exp_alerts: []
      - eval_time: 10m
        alertname: SftpgateSpoolDiskLow
        exp_alerts: []
      - eval_time: 10m
        alertname: SftpgateIPsBlocked
        exp_alerts: []

  - name: actions retrying, then giving up
    interval: 1m
    input_series:
      - series: 'sftpgate_actions_total{step="job", result="failed"}'
        values: "0 0 1 2"
      - series: 'sftpgate_actions_queue_depth{state="failed"}'
        values: "0 0 0 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: SftpgateActionsRetrying
        exp_alerts: []
      - eval_time: 3m
        alertname: SftpgateActionsRetrying
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Actions are failing and being retried. Check the "action" lines in the audit log.
      - eval_time: 3m
        alertname: SftpgateActionsGaveUp
        exp_alerts:
          - exp_labels: { severity: critical, state: failed }
            exp_annotations:
              summary: "1 action job(s) gave up. Their files are in the bucket but were not processed; see the queue/failed folder."

  - name: actions that could not be queued
    interval: 1m
    input_series:
      - series: 'sftpgate_actions_total{step="queue", result="failed"}'
        values: "0 0 1 1"
    alert_rule_test:
      - eval_time: 3m
        alertname: SftpgateActionsNotQueued
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Files were saved but their after_* actions could not be queued (spool disk full or not writable).

  - name: a failing scheduled transfer is named
    interval: 1m
    input_series:
      - series: 'sftpgate_transfer_runs_total{transfer="bank-statements", result="failed"}'
        values: "0 0 1 1"
      - series: 'sftpgate_transfer_runs_total{transfer="gst-returns", result="failed"}'
        values: "0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: SftpgateTransferFailing
        exp_alerts:
          - exp_labels: { severity: warning, transfer: bank-statements }
            exp_annotations:
              summary: "Scheduled transfer bank-statements failed in the last hour. Check the transfer events."
