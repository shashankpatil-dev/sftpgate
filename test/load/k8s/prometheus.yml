# Prometheus config for the load test. It finds every SFTPgate pod through
# the headless service, and loads the same alert rules production uses.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: sftpgate
    dns_sd_configs:
      - names: [sftpgate-pods.sftpgate-load.svc.cluster.local]
        type: A
        port: 8080
        refresh_interval: 5s
