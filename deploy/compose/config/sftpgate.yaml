# Config for the local test setup in docker-compose.yml.
# One demo account sees two folders: one backed by an S3 mock, one by a GCS emulator.

version: 1

server:
  host_keys: [/etc/sftpgate/keys/ssh_host_ed25519_key]
  min_spool_free: 100MiB
  reload_interval: 2s
  timezone: Asia/Kolkata

# Opens the read-only web UI at http://localhost:8080/ui/
http:
  tokens: ["${env:SFTPGATE_UI_TOKEN}"]

storages:
  s3: "s3://recon-raw?endpoint=http://s3:9090&use_path_style=true&region=us-east-1"
  gcs: "gs://recon-raw"

accounts:
  - name: demo
    description: Local test account (password is "demo")
    auth:
      public_keys:
        - "${file:/etc/sftpgate/keys/demo_user.pub}"
        # Used by the demo-pull transfer below.
        - "${file:/etc/sftpgate/keys/transfer_key.pub}"
      password_hash: "${env:DEMO_PW_HASH}"
    folders:
      - path: /s3
        storage: s3
        prefix: demo/
        perms: [list, download, upload, overwrite, delete, rename, mkdir]
        # Every file uploaded here is also copied into the GCS bucket.
        on_upload:
          - copy: { storage: gcs, key: "demo/copies/{filename}" }
      - path: /gcs
        storage: gcs
        prefix: demo/
        perms: [list, download, upload, overwrite, delete, rename, mkdir]

# A scheduled transfer that pulls from this same server, to show how it works:
# every 5 seconds, *.pull files in the demo account's /s3 folder move to /gcs/pulled.
remotes:
  self:
    addr: localhost:2222
    user: demo
    host_key: "${file:/etc/sftpgate/keys/ssh_host_ed25519_key.pub}"
    private_key: "${file:/etc/sftpgate/keys/transfer_key}"

transfers:
  - name: demo-pull
    schedule: "@every 5s"
    pull:
      from: { remote: self, path: /s3, pattern: "*.pull" }
      to: { storage: gcs, key: "demo/pulled/{filename}" }
      delete_after: true
