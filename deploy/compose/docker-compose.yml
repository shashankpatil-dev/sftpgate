# Local test setup: SFTPgate with an S3 mock, a GCS emulator, Prometheus,
# Grafana and Jaeger.
#
#   make up         # start everything (creates test keys the first time)
#   make e2e        # run the end-to-end checks
#   make down       # stop and delete all data
#
# Then:
#   sftp -P 2222 -i .dev/keys/demo_user demo@localhost
#   Grafana dashboard:  http://localhost:3000
#   Prometheus:         http://localhost:9090 (Alerts tab shows the alert rules)
#   Jaeger (traces):    http://localhost:16686
#   SFTPgate web UI:    http://localhost:8080/ui/ (any user, password dev-only-ui-token)

name: sftpgate-dev

services:
  sftpgate:
    build: ../..
    ports:
      - "2222:2222"
      - "8080:8080"
    environment:
      # Dev-only hash of the password "demo". Real secrets come from your secret store.
      DEMO_PW_HASH: "$$2a$$10$$2Gafkwej3cTm6teT4wIDAu2H.NtwtNJw9zUmmREU.5pRKdLIStkme"
      # The S3 mock accepts any credentials, but the AWS client needs some.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Sends gs:// traffic to the GCS emulator instead of Google.
      STORAGE_EMULATOR_HOST: fake-gcs:4443
      SFTPGATE_CONFIG: /etc/sftpgate/config/sftpgate.yaml
      # Dev only: the password for the web UI at http://localhost:8080/ui/
      SFTPGATE_UI_TOKEN: dev-only-ui-token
      # Sends traces to Jaeger. Without this variable tracing is off.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      # Mount the folder, not the file. Editors and git replace files instead
      # of changing them, and a single-file mount would keep the old one,
      # so hot reload would silently stop working.
      - ./config:/etc/sftpgate/config:ro
      - ../../.dev/keys:/etc/sftpgate/keys:ro
      - spool:/var/lib/sftpgate/spool
    read_only: true
    depends_on:
      s3:
        condition: service_started
      fake-gcs:
        condition: service_started
      jaeger:
        condition: service_started
    restart: on-failure

  s3:
    image: adobe/s3mock:4.7.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: recon-raw

  # Known emulator limit: listings stop at 1000 objects (no next-page token).
  # Real GCS pages normally, and the S3 mock lists any number of files.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.52.2
    command: ["-scheme", "http", "-port", "4443", "-public-host", "fake-gcs:4443", "-backend", "memory", "-data", "/data"]
    volumes:
      # Each folder under gcs-data becomes a bucket.
      - ./gcs-data:/data:ro

  prometheus:
    image: prom/prometheus:v3.6.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - sftpgate

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "3000:3000"
    environment:
      # Dev only: anyone can look at the dashboard without logging in.
      # The admin login is admin / admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sftpgate.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686"

volumes:
  spool:
