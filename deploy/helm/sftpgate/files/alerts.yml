# Alert rules for SFTPgate. Copy them into your own Prometheus and tune the
# numbers to your traffic.

groups:
  - name: sftpgate
    rules:
      - alert: SftpgateDown
        expr: up{job="sftpgate"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: SFTPgate is not answering on /metrics.

      - alert: SftpgateNotReady
        expr: absent(sftpgate_config_info) == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: SFTPgate is running but has published no config.

      - alert: SftpgateLoginFailureSpike
        expr: sum(increase(sftpgate_auth_total{result="failed"}[5m])) > 20
        labels:
          severity: warning
        annotations:
          summary: More than 20 failed logins in 5 minutes. Someone may be guessing passwords.

      - alert: SftpgateIPsBlocked
        expr: sftpgate_throttled_ips > 0
        labels:
          severity: info
        annotations:
          summary: "{{ $value }} IP(s) are blocked after too many failed logins."

      - alert: SftpgateStorageErrors
        expr: sum by (storage) (increase(sftpgate_storage_errors_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Storage {{ $labels.storage }} is returning errors. Uploads or downloads may be failing."

      - alert: SftpgateConfigReloadFailed
        expr: increase(sftpgate_config_reload_total{result="error"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A new config was rejected. The old config is still running; check the logs and fix the file.

      - alert: SftpgateSpoolDiskLow
        expr: sftpgate_spool_free_bytes < 2 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Less than 2 GiB free on the upload spool disk. Large uploads will soon be refused.

      - alert: SftpgateActionsRetrying
        expr: sum(increase(sftpgate_actions_total{step="job", result="failed"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Post-upload actions are failing and being retried. Check the "action" lines in the audit log.

      - alert: SftpgateActionsGaveUp
        expr: sftpgate_actions_queue_depth{state="failed"} > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} post-upload job(s) gave up. Their files are in the bucket but were not processed; see the queue/failed folder."

      - alert: SftpgateActionsNotQueued
        expr: sum(increase(sftpgate_actions_total{step="queue", result="failed"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Files were saved but their post-upload actions could not be queued (spool disk full or not writable).

      - alert: SftpgateTransferFailing
        expr: sum by (transfer) (increase(sftpgate_transfer_runs_total{result="failed"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Scheduled transfer {{ $labels.transfer }} failed in the last hour. Check the transfer events."
