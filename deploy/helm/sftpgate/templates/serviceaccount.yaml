{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sftpgate.serviceAccountName" . }}
  labels:
    {{- include "sftpgate.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# SFTPgate never talks to the Kubernetes API, so it gets no token.
automountServiceAccountToken: false
{{- end }}
