name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - name: Test
        run: go test -race ./...
      - name: Check example configs
        run: make validate

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the local setup
        run: make up
      - name: Run end-to-end checks
        run: make e2e
      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs
