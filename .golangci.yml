version: "2"

linters:
  # On top of the defaults (errcheck, govet, ineffassign, staticcheck, unused).
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert

  settings:
    errcheck:
      # Closing a network connection at the end of its life can't lose data,
      # so these errors are safe to ignore.
      exclude-functions:
        - (net.Conn).Close
        - (golang.org/x/crypto/ssh.Conn).Close
        - (golang.org/x/crypto/ssh.Channel).Close

  exclusions:
    rules:
      # Tests close clients in defers all the time; failures there don't matter.
      - path: ^test/
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/shashankpatil-dev/sftpgate
